<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-label="Scour logo">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1b1f28"/>
      <stop offset="1" stop-color="#0d0f14"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.42" r="0.6">
      <stop offset="0" stop-color="#fb7185" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#fb7185" stop-opacity="0"/>
    </radialGradient>

    <!-- ordered-dither halftone tiles, one per disk segment -->
    <pattern id="d-rose" width="10" height="10" patternUnits="userSpaceOnUse">
      <rect width="10" height="10" fill="#7f1d32"/>
      <circle cx="2.5" cy="2.5" r="2.1" fill="#fb7185"/>
      <circle cx="7.5" cy="7.5" r="2.1" fill="#fb7185"/>
    </pattern>
    <pattern id="d-coral" width="10" height="10" patternUnits="userSpaceOnUse">
      <rect width="10" height="10" fill="#7a2f24"/>
      <circle cx="2.5" cy="2.5" r="2.1" fill="#fb923c"/>
      <circle cx="7.5" cy="7.5" r="2.1" fill="#fb923c"/>
    </pattern>
    <pattern id="d-amber" width="10" height="10" patternUnits="userSpaceOnUse">
      <rect width="10" height="10" fill="#6b5310"/>
      <circle cx="2.5" cy="2.5" r="2.1" fill="#fbbf24"/>
      <circle cx="7.5" cy="7.5" r="2.1" fill="#fbbf24"/>
    </pattern>
    <pattern id="d-teal" width="10" height="10" patternUnits="userSpaceOnUse">
      <rect width="10" height="10" fill="#0d4f4a"/>
      <circle cx="2.5" cy="2.5" r="2.1" fill="#2dd4bf"/>
      <circle cx="7.5" cy="7.5" r="2.1" fill="#2dd4bf"/>
    </pattern>
    <pattern id="d-slate" width="10" height="10" patternUnits="userSpaceOnUse">
      <rect width="10" height="10" fill="#2a303c"/>
      <circle cx="2.5" cy="2.5" r="2.1" fill="#94a3b8"/>
      <circle cx="7.5" cy="7.5" r="2.1" fill="#94a3b8"/>
    </pattern>

    <clipPath id="diskClip">
      <path d="M256 96 A160 160 0 1 1 255.9 96 Z M256 176 A80 80 0 1 0 256.1 176 Z" fill-rule="evenodd"/>
    </clipPath>
  </defs>

  <rect width="512" height="512" rx="112" fill="url(#bg)"/>
  <circle cx="256" cy="256" r="230" fill="url(#glow)"/>

  <!-- segmented disk ring -->
  <g clip-path="url(#diskClip)">
    <rect x="80" y="80" width="352" height="80" fill="url(#d-rose)"/>
    <rect x="80" y="160" width="352" height="60" fill="url(#d-coral)"/>
    <rect x="80" y="220" width="352" height="50" fill="url(#d-amber)"/>
    <rect x="80" y="270" width="352" height="60" fill="url(#d-teal)"/>
    <rect x="80" y="330" width="352" height="110" fill="url(#d-slate)"/>
  </g>

  <!-- crisp rim -->
  <circle cx="256" cy="256" r="160" fill="none" stroke="#fb7185" stroke-opacity="0.55" stroke-width="2"/>
  <circle cx="256" cy="256" r="80" fill="none" stroke="#e8ebf0" stroke-opacity="0.12" stroke-width="2"/>

  <!-- cleaning sweep -->
  <path d="M138 156 A160 160 0 0 1 300 100" fill="none" stroke="#ffffff" stroke-opacity="0.85" stroke-width="6" stroke-linecap="round"/>
  <circle cx="300" cy="100" r="7" fill="#fff"/>
  <circle cx="300" cy="100" r="14" fill="#fff" fill-opacity="0.18"/>
</svg>
