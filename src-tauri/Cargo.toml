[package]
name = "scour"
version = "0.1.0"
description = "Review-first Windows cleaner powered by the Burrow engine"
authors = ["khentmoba"]
edition = "2021"

[[bin]]
name = "scour"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-updater = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
trash = "5.3"
